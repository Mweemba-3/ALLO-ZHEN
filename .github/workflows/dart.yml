name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      # 🔥 THE FIX: Disable the migration BEFORE anything else runs
      - name: Disable Swift Package Manager migration
        run: |
          echo "FLUTTER_SUPPRESS_MIGRATIONS=true" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # 🔥 FIX iOS DEPLOYMENT TARGET TO 14.0 FOR COCOAPODS
      - name: Update iOS Deployment Target in Podfile
        run: |
          PODFILE_PATH="ios/Podfile"
          if [ -f "$PODFILE_PATH" ]; then
            # Uncomment platform line and set it to 14.0
            sed -i '' "s/# platform :ios, '.*'/platform :ios, '14.0'/" "$PODFILE_PATH"
            sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/" "$PODFILE_PATH"
            echo "Successfully updated Podfile platform to 14.0"
          else
            echo "Podfile not found!"
            exit 1
          fi

      - run: flutter pub get

      - name: Fix .gitignore encoding (just in case)
        run: |
          echo "# Flutter" > .gitignore
          echo "build/" >> .gitignore
          echo ".dart_tool/" >> .gitignore
          echo ".idea/" >> .gitignore
          echo ".vscode/" >> .gitignore
          echo "*.log" >> .gitignore
          echo "*.iml" >> .gitignore
          echo "ios/Pods/" >> .gitignore
          echo "ios/.symlinks/" >> .gitignore
          echo "ios/Flutter/Generated.xcconfig" >> .gitignore
          echo "ios/Flutter/flutter_export_environment.sh" >> .gitignore
          echo "android/.gradle/" >> .gitignore
          echo "android/app/build/" >> .gitignore
          echo "android/.kotlin/" >> .gitignore
          echo "pubspec.lock" >> .gitignore
          echo ".metadata" >> .gitignore

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
