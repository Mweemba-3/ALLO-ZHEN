name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      # Disable the Swift Package Manager migration
      - name: Disable Swift Package Manager migration
        run: |
          echo "FLUTTER_SUPPRESS_MIGRATIONS=true" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Absolute rewrite of Podfile to guarantee iOS 14.0 is at the top
      - name: Force iOS 14.0 Platform in Podfile
        run: |
          PODFILE="ios/Podfile"
          if [ -f "$PODFILE" ]; then
            echo "Rewriting Podfile to explicitly set platform to iOS 14.0..."
            
            # Create a clean Podfile with iOS 14 forced at the top
            cat << 'EOF' > "$PODFILE"
# Uncomment this line to define a global platform for your project
platform :ios, '14.0'

# CocoaPods analytics sends network stats synchronously affecting flutter build latency.
ENV['COCOAPODS_DISABLE_STATS'] = 'true'

project 'Runner', {
  'Debug' => :debug,
  'Profile' => :release,
  'Release' => :release,
}

def flutter_root
  generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
  unless File.exist?(generated_xcode_build_settings_path)
    raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
  end

  File.foreach(generated_xcode_build_settings_path) do |line|
    matches = line.match(/FLUTTER_ROOT\=(.*)/)
    return matches[1].strip if matches
  end
  raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
end

require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

flutter_ios_podfile_setup

target 'Runner' do
  use_frameworks!
  use_modular_headers!

  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
end

post_install do |installer|
  installer.generated_projects.each do |project|
    project.targets.each do |target|
      target.build_configurations.each do |config|
        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
      end
    end
  end
end
EOF
            echo "Successfully forced iOS 14.0 inside Podfile."
          else
            echo "Error: ios/Podfile not found!"
            exit 1
          fi

      - run: flutter pub get

      - name: Fix .gitignore encoding (just in case)
        run: |
          echo "# Flutter" > .gitignore
          echo "build/" >> .gitignore
          echo ".dart_tool/" >> .gitignore
          echo ".idea/" >> .gitignore
          echo ".vscode/" >> .gitignore
          echo "*.log" >> .gitignore
          echo "*.iml" >> .gitignore
          echo "ios/Pods/" >> .gitignore
          echo "ios/.symlinks/" >> .gitignore
          echo "ios/Flutter/Generated.xcconfig" >> .gitignore
          echo "ios/Flutter/flutter_export_environment.sh" >> .gitignore
          echo "android/.gradle/" >> .gitignore
          echo "android/app/build/" >> .gitignore
          echo "android/.kotlin/" >> .gitignore
          echo "pubspec.lock" >> .gitignore
          echo ".metadata" >> .gitignore

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
