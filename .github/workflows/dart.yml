name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Disable Swift Package Manager migration
        run: echo "FLUTTER_SUPPRESS_MIGRATIONS=true" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - name: Force iOS 14.0 in Xcode Project and Podfile
        run: |
          PODFILE="ios/Podfile"
          if [ -f "$PODFILE" ]; then
            sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" "$PODFILE"
            if ! grep -q "platform :ios" "$PODFILE"; then
              sed -i '' "1s/^/platform :ios, '14.0'\n/" "$PODFILE"
            fi
          fi

          # Force Xcode project deployment target to 14.0 using a Ruby snippet
          ruby -e '
            project_path = "ios/Runner.xcodeproj/project.pbxproj"
            content = File.read(project_path)
            content.gsub!(/IPHONEOS_DEPLOYMENT_TARGET = 13.0/, "IPHONEOS_DEPLOYMENT_TARGET = 14.0")
            content.gsub!(/IPHONEOS_DEPLOYMENT_TARGET = "13.0"/, "IPHONEOS_DEPLOYMENT_TARGET = \"14.0\"")
            File.write(project_path, content)
          '
          echo "Successfully forced iOS 14.0 deployment target."

      - name: Build iOS Release
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=14.0
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app/ Payload
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/Payload/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "Automatic iOS Build release"
