name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      # 👇 PUT THE FIX HERE (between pub get and pod repo update)
      - name: Fix .gitignore encoding and skip migration
        run: |
          echo "# Flutter" > .gitignore
          echo "build/" >> .gitignore
          echo ".dart_tool/" >> .gitignore
          echo ".idea/" >> .gitignore
          echo ".vscode/" >> .gitignore
          echo "*.log" >> .gitignore
          echo "*.iml" >> .gitignore
          echo "ios/Pods/" >> .gitignore
          echo "ios/.symlinks/" >> .gitignore
          echo "ios/Flutter/Generated.xcconfig" >> .gitignore
          echo "ios/Flutter/flutter_export_environment.sh" >> .gitignore
          echo "android/.gradle/" >> .gitignore
          echo "android/app/build/" >> .gitignore
          echo "android/.kotlin/" >> .gitignore
          echo "pubspec.lock" >> .gitignore
          echo ".metadata" >> .gitignore
          export FLUTTER_SUPPRESS_MIGRATIONS=true

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"
